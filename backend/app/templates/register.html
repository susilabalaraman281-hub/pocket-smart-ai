<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PocketSmart AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .auth-page {
            min-height: calc(100vh - 88px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 40px;
            border-radius: 28px;
            box-shadow: 0 15px 45px rgba(50, 40, 90, 0.10);
        }

        .auth-card h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .auth-card > p {
            color: #706d78;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd9e8;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #7652f4;
        }

        .auth-submit {
            width: 100%;
            border: none;
            background: #7652f4;
            color: white;
            padding: 16px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            margin-top: 10px;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #706d78;
        }

        .login-link a {
            color: #7652f4;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header class="navbar">
    <div class="logo">
        PocketSmart <span>AI</span>
    </div>
</header>

<main class="auth-page">

    <div class="auth-card">

        <h1>Create Account</h1>

        <p>
            Register to start creating your personalized
            budget plans with PocketSmart AI.
        </p>

        <form method="POST" action="/register">

            <div class="form-group">
                <label>Full Name</label>
                <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required
                    minlength="6"
                >
            </div>

            <button class="auth-submit" type="submit">
                Create Account
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="/">Go to Home</a>
        </div>

    </div>

</main>

</body>
</html>
